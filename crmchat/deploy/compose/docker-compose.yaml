# CRM-Chat 部署编排：仓库为唯一事实源，Jenkins 部署阶段自动同步本目录到部署机并拉起，
# 无需在部署机手工预置任何文件。
# 环境差异由同目录 .env.<env> 承载（dev/test 已入库；prod 见 .env.prod.example 说明）。
# 手工运维示例（在部署机 /opt/crm-chat/compose 下执行）：
#   REGISTRY=10.242.98.181:9093/crmchat TAG=<tag> \
#     docker compose -p crm-chat-dev -f docker-compose.yaml --env-file .env.dev up -d
# 首次部署后需初始化数据库：访问 http://<host>:<APP_PORT>/install 走安装向导，
# 或手动导入 public/install/crmeb.sql。
services:
  crm-chat:
    image: ${REGISTRY}/crm-chat:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "${APP_PORT:-20108}:20108"
    environment:
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_INSTALLED: "${APP_INSTALLED:-false}"
      APP_KEY: "${APP_KEY:?请在env文件中设置APP_KEY}"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-crmchat}"
      DB_USER: "${DB_USER:-crmchat}"
      DB_PASSWORD: "${DB_PASSWORD:?请在env文件中设置DB_PASSWORD}"
      DB_PREFIX: "${DB_PREFIX:-eb_}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - crmchat-uploads:/var/www/crmchat/public/uploads
      - crmchat-runtime:/var/www/crmchat/runtime

  mysql:
    image: mysql:5.7
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在env文件中设置MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME:-crmchat}"
      MYSQL_USER: "${DB_USER:-crmchat}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - crmchat-mysql:/var/lib/mysql

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server ${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    volumes:
      - crmchat-redis:/data

# 卷名会带 compose 项目前缀（-p crm-chat-<env>），dev/test 同机部署互不影响
volumes:
  crmchat-mysql:
  crmchat-redis:
  crmchat-uploads:
  crmchat-runtime:
